<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ricoh</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <link rel="stylesheet" href="styles/page-chrome.css">
  <style>
    html { overflow: hidden; scrollbar-gutter: auto; }
    body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    header { flex: none; width: 100%; }
    .viewer { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 0 24px 16px; }
    .frame { position: relative; flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
    .frame img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; transition: opacity 0.18s ease; }
    .frame img.fading { opacity: 0.15; }
    .hit { position: absolute; top: 0; bottom: 0; width: 50%; border: 0; background: transparent; -webkit-tap-highlight-color: transparent; }
    .hit.prev { left: 0; cursor: w-resize; }
    .hit.next { right: 0; cursor: e-resize; }
    .bar {
      flex: none; display: flex; align-items: center; gap: 14px; padding-top: 12px;
      color: #7f92a4; font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase;
    }
    .bar button { background: none; border: 0; color: #687888; font-size: 0.95rem; line-height: 1; padding: 4px 10px; cursor: pointer; }
    .bar button:hover { color: #f1f4f7; }
    .count { color: #42505d; }
    @media (max-width: 640px) { .viewer { padding: 0 8px 12px; } }
  </style>
</head>
<body>
  <header>
    <div class="header-copy">
      <div class="header-main">
        <h1>Ricoh</h1>
      </div>
      <div class="header-subline">
        <p>Favourites from the Ricoh GR III, Tokyo to Europe, 2025–2026.</p>
        <div class="header-links">
          <a href="index.html" class="nav-link">Home</a>
        </div>
      </div>
    </div>
  </header>

  <main class="viewer">
    <div class="frame">
      <img id="photo" src="images/ricoh/r0000127.jpg" srcset="images/ricoh/r0000127-sm.jpg 1000w, images/ricoh/r0000127.jpg 2000w" sizes="100vw" alt="">
      <button class="hit prev" data-step="-1" aria-label="Previous photo"></button>
      <button class="hit next" data-step="1" aria-label="Next photo"></button>
    </div>
    <div class="bar">
      <button data-step="-1" aria-label="Previous photo">&larr;</button>
      <span id="caption">Kabukichō · Jul 2025</span>
      <span class="count" id="count">1 / 35</span>
      <button data-step="1" aria-label="Next photo">&rarr;</button>
    </div>
  </main>

    const img = document.getElementById('photo');
    const caption = document.getElementById('caption');
    const count = document.getElementById('count');
    const srcset = p => `${p.sm} 1000w, ${p.src} 2000w`;
    let current = 0;

    function load(p) {
      const im = new Image();
      im.sizes = '100vw';
      im.srcset = srcset(p);
      im.src = p.src;
      return im;
    }

    function show(i) {
      current = (i + photos.length) % photos.length;
      const want = current;
      const p = photos[want];
      caption.textContent = p.caption;
      count.textContent = `${want + 1} / ${photos.length}`;
      history.replaceState(null, '', '#' + (want + 1));
      img.classList.add('fading');
      const next = load(p);
      const swap = () => {
        if (want !== current) return;  // a later click already moved on
        img.srcset = srcset(p);
        img.src = p.src;
        img.classList.remove('fading');
      };
      next.decode().then(swap, swap);
      load(photos[(want + 1) % photos.length]);
      load(photos[(want - 1 + photos.length) % photos.length]);
    }

    document.querySelectorAll('[data-step]').forEach(b =>
      b.addEventListener('click', () => show(current + Number(b.dataset.step))));
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') show(current + 1);
      if (e.key === 'ArrowLeft') show(current - 1);
    });
    let touchX = null;
    const frame = document.querySelector('.frame');
    frame.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
    frame.addEventListener('touchend', e => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      touchX = null;
      if (Math.abs(dx) > 40) show(current + (dx < 0 ? 1 : -1));
    });

    const start = parseInt(location.hash.slice(1), 10);
    show(start >= 1 && start <= photos.length ? start - 1 : 0);
  </script>
