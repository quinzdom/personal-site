  <style>
    html { overflow: hidden; scrollbar-gutter: auto; }
    body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    header { flex: none; width: 100%; }
    .viewer { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 0 24px; }
    .frame { position: relative; flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
    .frame img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; transition: opacity 0.18s ease; }
    .frame img.fading { opacity: 0.15; }
    .hit { position: absolute; top: 0; bottom: 0; width: 50%; border: 0; background: transparent; -webkit-tap-highlight-color: transparent; }
    .hit.prev { left: 0; cursor: w-resize; }
    .hit.next { right: 0; cursor: e-resize; }
    .bar {
      flex: none; display: flex; align-items: center; gap: 14px; padding-top: 10px;
      color: #7f92a4; font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase;
    }
    .bar button { background: none; border: 0; color: #687888; font-size: 0.95rem; line-height: 1; padding: 4px 10px; cursor: pointer; }
    .bar button:hover { color: #f1f4f7; }
    .count { color: #42505d; }
    .thumbs { flex: none; width: 100%; overflow-x: auto; padding: 10px 24px 14px; scrollbar-width: thin; scrollbar-color: #2b333b transparent; }
    .thumbs-row { display: flex; gap: 6px; width: max-content; margin: 0 auto; }
    .thumbs button { flex: none; padding: 0; border: 0; background: #1b2026; cursor: pointer; opacity: 0.4; transition: opacity 0.15s ease; }
    .thumbs button:hover, .thumbs button:focus-visible { opacity: 0.85; }
    .thumbs button[aria-current="true"] { opacity: 1; outline: 1px solid #a6b5c3; outline-offset: 2px; }
    .thumbs img { display: block; height: 56px; width: auto; }
    .bar .full { display: inline-flex; align-items: center; padding: 4px 6px; }
    .bar .full svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.6; }
    .bar .full .exit, :root.immersive .bar .full .enter { display: none; }
    :root.immersive .bar .full .exit { display: inline; }
    :root.immersive, :root.immersive body { background: #000; }
    :root.immersive header, :root.immersive .thumbs, :root.immersive .bar { display: none; }
    :root.immersive .viewer { padding: 0; }
    :root.immersive.idle, :root.immersive.idle * { cursor: none !important; }
    @media (max-width: 640px) {
      .viewer { padding: 0 8px; }
      .thumbs { padding: 8px 8px 12px; }
      .thumbs img { height: 44px; }
    }

    const img = document.getElementById('photo');
    const caption = document.getElementById('caption');
    const count = document.getElementById('count');
    const thumbButtons = [...document.querySelectorAll('.thumbs button')];
    const srcset = p => `${p.sm} 1000w, ${p.src} 2000w`;
    let current = -1;

    function load(p) {
      const im = new Image();
      im.sizes = '100vw';
      im.srcset = srcset(p);
      im.src = p.src;
      return im;
    }

    function show(i, smooth = true) {
      const previous = current;
      current = (i + photos.length) % photos.length;
      const want = current;
      const p = photos[want];
      caption.textContent = p.caption;
      count.textContent = `${want + 1} / ${photos.length}`;
      history.replaceState(null, '', '#' + (want + 1));
      if (previous >= 0) thumbButtons[previous].removeAttribute('aria-current');
      thumbButtons[want].setAttribute('aria-current', 'true');
      thumbButtons[want].scrollIntoView({ block: 'nearest', inline: 'center', behavior: smooth ? 'smooth' : 'auto' });
      img.classList.add('fading');
      const next = load(p);
      const swap = () => {
        if (want !== current) return;  // a later click already moved on
        img.srcset = srcset(p);
        img.src = p.src;
        img.classList.remove('fading');
      };
      next.decode().then(swap, swap);
      load(photos[(want + 1) % photos.length]);
      load(photos[(want - 1 + photos.length) % photos.length]);
    }

    document.querySelectorAll('[data-step]').forEach(b =>
      b.addEventListener('click', () => show(current + Number(b.dataset.step))));
    thumbButtons.forEach(b => b.addEventListener('click', () => show(Number(b.dataset.i))));
    // Full screen: the browser's real full screen where it exists, plus a CSS mode that
    // hides everything but the photo (the only option on iPhone Safari).
    const root = document.documentElement;
    const fullButton = document.getElementById('full');
    const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
    function setImmersive(on) {
      root.classList.toggle('immersive', on);
      fullButton.setAttribute('aria-label', on ? 'Exit full screen (Esc)' : 'Full screen (F)');
      fullButton.title = fullButton.getAttribute('aria-label');
      if (on && !fsElement()) {
        const request = root.requestFullscreen || root.webkitRequestFullscreen;
        if (request) Promise.resolve(request.call(root)).catch(() => {});
      } else if (!on && fsElement()) {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        Promise.resolve(exit.call(document)).catch(() => {});
      }
      thumbButtons[current]?.scrollIntoView({ block: 'nearest', inline: 'center' });
    }
    fullButton.addEventListener('click', () => setImmersive(!root.classList.contains('immersive')));
    // In full screen nothing but the photo shows; the cursor hides too once the mouse rests.
    let idleTimer;
    document.addEventListener('mousemove', () => {
      root.classList.remove('idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => root.classList.add('idle'), 1500);
    });
    const leftFullscreen = () => { if (!fsElement() && root.classList.contains('immersive')) setImmersive(false); };
    document.addEventListener('fullscreenchange', leftFullscreen);
    document.addEventListener('webkitfullscreenchange', leftFullscreen);

    document.addEventListener('keydown', e => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'ArrowRight') show(current + 1);
      if (e.key === 'ArrowLeft') show(current - 1);
      if (e.key === 'f' || e.key === 'F') setImmersive(!root.classList.contains('immersive'));
      if (e.key === 'Escape' && root.classList.contains('immersive')) setImmersive(false);
    });
    let touchX = null, touchY = null;
    const frame = document.querySelector('.frame');
    frame.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, { passive: true });
    frame.addEventListener('touchend', e => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      const dy = e.changedTouches[0].clientY - touchY;
      touchX = touchY = null;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) show(current + (dx < 0 ? 1 : -1));
      else if (dy > 80 && root.classList.contains('immersive')) setImmersive(false);  // swipe down leaves full screen
    });

    const start = parseInt(location.hash.slice(1), 10);
    show(start >= 1 && start <= photos.length ? start - 1 : 0, false);
