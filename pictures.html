  <style>
    /* Founders Grotesk (Klim) is licensed to the owner; no font file lives in this public repo. */
    @font-face { font-family: 'Founders Grotesk'; font-weight: 300; font-display: swap;
      src: local('Founders Grotesk Light'), local('FoundersGrotesk-Light'); }
    @font-face { font-family: 'Founders Grotesk'; font-weight: 400; font-display: swap;
      src: local('Founders Grotesk Regular'), local('FoundersGrotesk-Regular'),
           url('https://list.dcdnt.xyz/fonts/founders-grotesk-regular.woff2') format('woff2'); }
    @font-face { font-family: 'Founders Grotesk'; font-weight: 700; font-display: swap;

    :root {
      color-scheme: dark;
      --bg: #000; --ink: #f2efe9; --muted: #8f8a82; --dim: #6b675f; --ph: #0d0d0d;
      --pink: #ff2d87;  /* hot pink, this page's one colour: the wordmark, hovers and the current photo */
      --side: 30px;  /* the margin all round the page, phones included */
      --g: 5px;  /* between photos, side by side and row to row */
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: 'Founders Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 300; font-size: 17px; line-height: 1.4; -webkit-font-smoothing: antialiased;
    }
    body.viewing { overflow: hidden; }
    a { color: inherit; text-decoration: none; }
    .sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; font: inherit; }
    a:focus-visible, button:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

    /* The wordmark and Home sit inside the top margin: a band as tall as the side margins, with their
       capitals centred in it (10px above them, about 10px below), so the photos start --side from the top. */
    .hd { max-width: 2000px; margin: 0 auto; height: var(--side); display: flex; align-items: baseline; justify-content: space-between; gap: 24px; padding: 10px var(--side) 0; line-height: 1; }
    .mark { color: var(--pink); font-weight: 700; font-size: 0.95rem; letter-spacing: 0.04em; text-transform: uppercase; }
    .hd nav a { color: var(--muted); font-weight: 400; font-size: 0.95rem; }
    .hd nav a:hover { color: var(--pink); }

    .wrap { max-width: 2000px; margin: 0 auto; padding: 0 var(--side) var(--side); }
    .row { display: flex; gap: var(--g); margin: 0 0 var(--g); }
    .row:last-child { margin-bottom: 0; }
    .row.loose { width: var(--fill); }
    .work { flex: var(--r) 1 0%; min-width: 0; margin: 0; }
    .ph { display: block; background: var(--ph); cursor: zoom-in; }
    .ph img { display: block; width: 100%; height: auto; aspect-ratio: var(--r); object-fit: cover; transition: opacity 0.35s ease; }
    .ph.ld img { opacity: 0; }
    .ph:hover img { opacity: 0.82; }
    @media (max-width: 768px) {
      .row { flex-wrap: wrap; row-gap: var(--g); }
      .row.loose { width: auto; }
      .work { flex: var(--r) 1 calc(var(--r) * 150px); max-width: calc(var(--r) * 62vh); }
    }

    .viewer { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; background: var(--bg); }
    .viewer.open { display: flex; }
    .frame { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 24px var(--side) 0; }
    .frame img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; transition: opacity 0.18s ease; }
    .frame img.fading { opacity: 0.15; }
    .hit { position: absolute; top: 0; bottom: 0; width: 50%; border: 0; background: transparent; -webkit-tap-highlight-color: transparent; }
    .hit.prev { left: 0; cursor: w-resize; }
    .hit.next { right: 0; cursor: e-resize; }
    .bar { flex: none; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 14px var(--side) 0; color: var(--muted); font-size: 15px; }
    .bar button { display: inline-flex; align-items: center; background: none; border: 0; color: var(--muted); font: inherit; font-weight: 400; padding: 6px 10px; cursor: pointer; }
    .bar button:hover { color: var(--pink); }
    .bar svg { display: block; width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.4; }
    .count { color: var(--dim); font-variant-numeric: tabular-nums; }
    .full .exit, :root.immersive .full .enter { display: none; }
    :root.immersive .full .exit { display: block; }
    .thumbs { flex: none; overflow-x: auto; padding: 12px var(--side) 18px; scrollbar-width: thin; scrollbar-color: #222 transparent; }
    .thumbs-row { display: flex; gap: 6px; width: max-content; margin: 0 auto; }
    .thumbs button { flex: none; padding: 0 0 5px; border: 0; background: none; cursor: pointer; opacity: 0.38; transition: opacity 0.15s ease; box-shadow: inset 0 -1px 0 transparent; }
    .thumbs button:hover, .thumbs button:focus-visible { opacity: 0.8; }
    .thumbs button[aria-current="true"] { opacity: 1; box-shadow: inset 0 -1px 0 var(--pink); }
    .thumbs img { display: block; height: 52px; width: auto; background: var(--ph); }
    :root.immersive .bar, :root.immersive .thumbs { display: none; }
    :root.immersive .frame { padding: 0; }
    :root.immersive.idle, :root.immersive.idle * { cursor: none !important; }
    @media (max-width: 640px) {
      .frame { padding: 12px 8px 0; }
      .bar { gap: 6px; font-size: 14px; }
      .thumbs img { height: 42px; }
    }
    @media (prefers-reduced-motion: reduce) { .ph img, .frame img, .thumbs button { transition: none; } }
  </style>

  <script>
    const photos = [{"src": "images/ricoh/r0000127.jpg", "sm": "images/ricoh/r0000127-sm.jpg", "caption": "Kabukichō · Jul 2025"}, {"src": "images/ricoh/r0001394.jpg", "sm": "images/ricoh/r0001394-sm.jpg", "caption": "Jul 2025"}, {"src": "images/ricoh/r0002015.jpg", "sm": "images/ricoh/r0002015-sm.jpg", "caption": "Jul 2025"}, {"src": "images/ricoh/r0002033.jpg", "sm": "images/ricoh/r0002033-sm.jpg", "caption": "Night streets · Jul 2025"}, {"src": "images/ricoh/r0003720.jpg", "sm": "images/ricoh/r0003720-sm.jpg", "caption": "Istanbul · Dec 2025"}, {"src": "images/ricoh/r0003736.jpg", "sm": "images/ricoh/r0003736-sm.jpg", "caption": "Istanbul · Dec 2025"}, {"src": "images/ricoh/r0003818.jpg", "sm": "images/ricoh/r0003818-sm.jpg", "caption": "Istanbul · Dec 2025"}, {"src": "images/ricoh/r0003949.jpg", "sm": "images/ricoh/r0003949-sm.jpg", "caption": "Athens · Dec 2025"}, {"src": "images/ricoh/r0004118.jpg", "sm": "images/ricoh/r0004118-sm.jpg", "caption": "Athens · Dec 2025"}, {"src": "images/ricoh/r0004142.jpg", "sm": "images/ricoh/r0004142-sm.jpg", "caption": "Athens · Dec 2025"}, {"src": "images/ricoh/r0004193.jpg", "sm": "images/ricoh/r0004193-sm.jpg", "caption": "Athens · Dec 2025"}, {"src": "images/ricoh/r0004369.jpg", "sm": "images/ricoh/r0004369-sm.jpg", "caption": "Bucharest · Dec 2025"}, {"src": "images/ricoh/r0004370.jpg", "sm": "images/ricoh/r0004370-sm.jpg", "caption": "Bucharest · Dec 2025"}, {"src": "images/ricoh/r0004409.jpg", "sm": "images/ricoh/r0004409-sm.jpg", "caption": "Bucharest · Dec 2025"}, {"src": "images/ricoh/r0004412.jpg", "sm": "images/ricoh/r0004412-sm.jpg", "caption": "Bucharest · Dec 2025"}, {"src": "images/ricoh/r0004417.jpg", "sm": "images/ricoh/r0004417-sm.jpg", "caption": "Bucharest · Dec 2025"}, {"src": "images/ricoh/r0004419.jpg", "sm": "images/ricoh/r0004419-sm.jpg", "caption": "Bucharest · Dec 2025"}, {"src": "images/ricoh/r0004421.jpg", "sm": "images/ricoh/r0004421-sm.jpg", "caption": "Bucharest · Dec 2025"}, {"src": "images/ricoh/r0004426.jpg", "sm": "images/ricoh/r0004426-sm.jpg", "caption": "Bucharest · Dec 2025"}, {"src": "images/ricoh/r0004680.jpg", "sm": "images/ricoh/r0004680-sm.jpg", "caption": "Basel & Alsace · Jan 2026"}, {"src": "images/ricoh/r0004759.jpg", "sm": "images/ricoh/r0004759-sm.jpg", "caption": "Basel & Alsace · Jan 2026"}, {"src": "images/ricoh/r0004914.jpg", "sm": "images/ricoh/r0004914-sm.jpg", "caption": "Paris · Jan 2026"}, {"src": "images/ricoh/r0004984.jpg", "sm": "images/ricoh/r0004984-sm.jpg", "caption": "Paris · Jan 2026"}, {"src": "images/ricoh/r0005066.jpg", "sm": "images/ricoh/r0005066-sm.jpg", "caption": "Paris · Jan 2026"}, {"src": "images/ricoh/r0005118.jpg", "sm": "images/ricoh/r0005118-sm.jpg", "caption": "Paris · Jan 2026"}, {"src": "images/ricoh/r0005151.jpg", "sm": "images/ricoh/r0005151-sm.jpg", "caption": "Paris · Jan 2026"}, {"src": "images/ricoh/r0005175.jpg", "sm": "images/ricoh/r0005175-sm.jpg", "caption": "Paris · Jan 2026"}, {"src": "images/ricoh/r0005570.jpg", "sm": "images/ricoh/r0005570-sm.jpg", "caption": "Snow · Feb 2026"}, {"src": "images/ricoh/r0005583.jpg", "sm": "images/ricoh/r0005583-sm.jpg", "caption": "Snow · Feb 2026"}, {"src": "images/ricoh/r0005633.jpg", "sm": "images/ricoh/r0005633-sm.jpg", "caption": "Plum blossoms · Feb 2026"}, {"src": "images/ricoh/r0005654.jpg", "sm": "images/ricoh/r0005654-sm.jpg", "caption": "Feb 2026"}, {"src": "images/ricoh/r0005692.jpg", "sm": "images/ricoh/r0005692-sm.jpg", "caption": "Niseko · Mar 2026"}, {"src": "images/ricoh/r0005702.jpg", "sm": "images/ricoh/r0005702-sm.jpg", "caption": "Cherry blossoms · Mar 2026"}, {"src": "images/ricoh/r0005711.jpg", "sm": "images/ricoh/r0005711-sm.jpg", "caption": "Shinjuku Gyoen · Jun 2026"}];
    const root = document.documentElement;
    const viewer = document.getElementById('viewer');
    const img = document.getElementById('photo');
    const caption = document.getElementById('caption');
    const count = document.getElementById('count');
    const tiles = [...document.querySelectorAll('.ph')];
    const thumbButtons = [...viewer.querySelectorAll('.thumbs button')];
    const srcset = p => `${p.sm} 1000w, ${p.src} 2000w`;
    const isOpen = () => viewer.classList.contains('open');
    let current = -1;
    let pushed = false;  // true when the viewer was opened from the grid, so Back returns to it

    // Grid photos fade in once loaded.
    tiles.forEach(a => {
      const im = a.querySelector('img');
      const done = () => a.classList.remove('ld');
      if (im.complete && im.naturalWidth) done();
      else { im.addEventListener('load', done); im.addEventListener('error', done); }
      a.addEventListener('click', () => { pushed = true; });
    });

    function load(p) {
      const im = new Image();
      im.sizes = '100vw';
      im.srcset = srcset(p);
      im.src = p.src;
      return im;
    }

    function show(i, smooth = true) {
      const previous = current;
      current = (i + photos.length) % photos.length;
      const want = current;
      const p = photos[want];
      caption.textContent = p.caption;
      count.textContent = `${want + 1} / ${photos.length}`;
      history.replaceState(history.state, '', '#' + (want + 1));
      if (previous >= 0) thumbButtons[previous].removeAttribute('aria-current');
      thumbButtons[want].setAttribute('aria-current', 'true');
      thumbButtons[want].scrollIntoView({ block: 'nearest', inline: 'center', behavior: smooth ? 'smooth' : 'auto' });
      img.classList.add('fading');
      const next = load(p);
      const swap = () => {
        if (want !== current) return;  // a later click already moved on
        img.srcset = srcset(p);
        img.src = p.src;
        img.classList.remove('fading');
      };
      next.decode().then(swap, swap);
      load(photos[(want + 1) % photos.length]);
      load(photos[(want - 1 + photos.length) % photos.length]);
    }

    function openViewer(i) {
      if (!isOpen()) {
        viewer.classList.add('open');
        document.body.classList.add('viewing');
      }
      show(i, false);
    }

    function closeViewer() {
      if (!isOpen()) return;
      if (root.classList.contains('immersive')) setImmersive(false);
      viewer.classList.remove('open');
      document.body.classList.remove('viewing');
      tiles[current]?.scrollIntoView({ block: 'center' });
    }

    function leave() {
      if (pushed) { pushed = false; history.back(); }  // the hashchange closes the viewer
      else { history.replaceState(null, '', location.pathname + location.search); closeViewer(); }
    }

    function sync() {
      const n = parseInt(location.hash.slice(1), 10);
      if (n >= 1 && n <= photos.length) openViewer(n - 1); else closeViewer();
    }

    // Full screen shows nothing but the photo: the browser's real full screen where it exists,
    // plus a CSS mode that hides everything else (the only option on iPhone Safari).
    const fullButton = document.getElementById('full');
    const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
    function setImmersive(on) {
      root.classList.toggle('immersive', on);
      fullButton.setAttribute('aria-label', on ? 'Exit full screen (Esc)' : 'Full screen (F)');
      fullButton.title = fullButton.getAttribute('aria-label');
      if (on && !fsElement()) {
        const request = root.requestFullscreen || root.webkitRequestFullscreen;
        if (request) Promise.resolve(request.call(root)).catch(() => {});
      } else if (!on && fsElement()) {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        Promise.resolve(exit.call(document)).catch(() => {});
      }
    }
    fullButton.addEventListener('click', () => setImmersive(!root.classList.contains('immersive')));
    const leftFullscreen = () => { if (!fsElement() && root.classList.contains('immersive')) setImmersive(false); };
    document.addEventListener('fullscreenchange', leftFullscreen);
    document.addEventListener('webkitfullscreenchange', leftFullscreen);
    let idleTimer;
    document.addEventListener('mousemove', () => {
      root.classList.remove('idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => root.classList.add('idle'), 1500);
    });

    viewer.querySelectorAll('[data-step]').forEach(b =>
      b.addEventListener('click', () => show(current + Number(b.dataset.step))));
    thumbButtons.forEach(b => b.addEventListener('click', () => show(Number(b.dataset.i))));
    document.getElementById('close').addEventListener('click', leave);
    document.addEventListener('keydown', e => {
      if (!isOpen() || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'ArrowRight') show(current + 1);
      else if (e.key === 'ArrowLeft') show(current - 1);
      else if (e.key === 'f' || e.key === 'F') setImmersive(!root.classList.contains('immersive'));
      else if (e.key === 'Escape') root.classList.contains('immersive') ? setImmersive(false) : leave();
    });
    let touchX = null, touchY = null;
    const frame = viewer.querySelector('.frame');
    frame.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, { passive: true });
    frame.addEventListener('touchend', e => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      const dy = e.changedTouches[0].clientY - touchY;
      touchX = touchY = null;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) show(current + (dx < 0 ? 1 : -1));
      else if (dy > 80) root.classList.contains('immersive') ? setImmersive(false) : leave();  // swipe down
    });

    window.addEventListener('hashchange', sync);
    sync();
